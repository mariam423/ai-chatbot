name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Dependency integrity (OWASP A08): fail the build on high/critical
      # vulnerabilities. The repo pins a patched deepmerge-ts via `overrides`
      # to keep `npm audit` clean while staying on Prisma 7.
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Lint, Prettier, typecheck
        run: npm run lint
      - name: Unit & integration tests
        run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # The app now targets Postgres (Neon in production); CI runs a throwaway
    # Postgres service so the committed migrations and the runtime adapter
    # (lib/db.ts → @prisma/adapter-pg) are exercised against the real engine.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulse_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The e2e suite runs with auth disabled (chat requests are mocked, so no
      # LLM key is needed). Provide the minimal env the production server and
      # NextAuth require, then apply the committed Postgres migrations to the
      # service above. .env is gitignored, so write it here.
      # STRIPE_WEBHOOK_SECRET enables the webhook route for e2e — the
      # webhook-rate-limit spec signs events with exactly this value.
      - name: Configure environment
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/pulse_ai" > .env
          echo "AUTH_DISABLED=true" >> .env
          echo "AUTH_TRUST_HOST=true" >> .env
          echo "AUTH_SECRET=${{ runner.os }}-ci-secret" >> .env
          echo "STRIPE_WEBHOOK_SECRET=whsec_e2e_testing" >> .env
      - name: Apply database migrations
        run: npx prisma migrate deploy
      # Direct CLI install — `playwright-community/install-browsers@main` was
      # the canonical action but the upstream repo is no longer resolvable
      # (`Unable to resolve action playwright-community/install-browsers,
      # repository not found`). The CLI below installs the same browsers
      # AND their system deps, which is what the action used to do.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E suite (builds + starts the production app)
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
